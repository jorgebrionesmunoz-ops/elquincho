<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3ed">
  <title>Tienda y punto de venta | El Quincho</title>
  <style>
    :root{color-scheme:light;--paper:#f4f3ed;--surface:#fffefa;--ink:#202b25;--muted:#788078;--line:#e6e5dc;--green:#245c43;--green-dark:#194733;--red:#a64b37;--shadow:0 2px 10px rgb(34 45 37 / 5%);font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--paper);color:var(--ink)}button,select{font:inherit}
    .topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 30px;border-bottom:1px solid var(--line);background:var(--surface)}
    .brand,.header-right{display:flex;align-items:center;gap:12px}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--green);color:white;font:700 19px Georgia,serif}.brand-title{font:700 18px Georgia,"Times New Roman",serif}.brand-subtitle{margin-top:3px;color:var(--muted);font-size:11px}.user-name{color:var(--muted);font-size:12px}
    .logout{padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:white;color:#59635b;cursor:pointer;font-size:11px}.logout:hover{border-color:#c8a9a0;color:var(--red)}
    main{width:min(1440px,100%);margin:0 auto;padding:25px 28px 40px}.page-heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow{margin:0 0 5px;color:#966a22;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font:600 28px Georgia,"Times New Roman",serif}.page-note{margin:5px 0 0;color:var(--muted);font-size:12px}.date-label{color:var(--muted);font-size:12px;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start;gap:18px}.catalog-panel,.cart-panel{border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:var(--shadow)}.catalog-panel{padding:18px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}h2{margin:0;font:600 18px Georgia,"Times New Roman",serif}.count{color:var(--muted);font-size:11px;white-space:nowrap}
    .filters{display:flex;gap:7px;overflow-x:auto;margin:0 0 16px;padding:0 0 3px}.filter{min-height:32px;flex:0 0 auto;padding:0 11px;border:1px solid var(--line);border-radius:4px;background:white;color:#606b62;cursor:pointer;font-size:11px}.filter[aria-pressed=true]{border-color:var(--green);background:var(--green);color:white}.filter:hover:not([aria-pressed=true]){background:#f3f4ee}
    .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:white;transition:box-shadow 150ms,border-color 150ms}.product-card:hover{border-color:#c9d4c9;box-shadow:0 5px 14px rgb(34 45 37 / 8%)}.product-image,.image-fallback{width:100%;height:145px;display:grid;place-items:center;object-fit:cover;background:#e9e9e0;color:#7c867c;font:28px Georgia,serif}.product-content{display:flex;min-height:150px;flex-direction:column;padding:12px}.product-category{color:#79847a;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.product-name{min-height:36px;margin:5px 0 2px;font-size:13px;font-weight:650;line-height:1.35}.product-price{color:var(--green);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.product-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:11px}.product-stock{color:var(--muted);font-size:10px}.add-button{min-height:32px;padding:0 10px;border:0;border-radius:4px;background:#26372e;color:white;cursor:pointer;font-size:10px;font-weight:700}.add-button:hover:not(:disabled){background:var(--green)}.add-button:disabled{background:#c7cdc7;cursor:not-allowed}.empty{grid-column:1/-1;padding:36px 12px;color:var(--muted);text-align:center;font-size:12px}
    .cart-panel{position:sticky;top:16px;display:flex;min-height:430px;flex-direction:column;padding:18px}.cart-list{flex:1;min-height:140px;max-height:350px;overflow:auto}.cart-empty{display:grid;min-height:140px;place-content:center;color:#989e97;text-align:center;font-size:12px}.cart-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 0;border-bottom:1px solid #efeee8}.cart-name{margin-bottom:4px;font-size:12px;font-weight:650;line-height:1.35}.cart-price{color:var(--muted);font-size:10px}.cart-subtotal{padding-top:1px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.quantity{display:inline-flex;align-items:center;gap:8px;margin-top:8px}.quantity button{width:23px;height:23px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:3px;background:white;cursor:pointer}.quantity button:hover:not(:disabled){border-color:#9eac9f;background:#e8f0e9}.quantity button:disabled{color:#b8beb8;cursor:not-allowed}.quantity span{min-width:12px;text-align:center;font-size:11px}
    .checkout{padding-top:14px;border-top:1px solid var(--line)}.payment-label{display:block;margin-bottom:6px;color:#687269;font-size:10px;font-weight:650}select{width:100%;height:38px;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);font-size:11px}.total-row{display:flex;align-items:baseline;justify-content:space-between;margin:15px 0}.total-label{color:#5f685f;font-size:12px}.total-value{color:var(--green);font:700 26px Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums}.checkout-button{width:100%;min-height:44px;border:0;border-radius:4px;background:var(--green);color:white;cursor:pointer;font-size:12px;font-weight:700}.checkout-button:hover:not(:disabled){background:var(--green-dark)}.checkout-button:disabled{background:#c4ccc4;cursor:not-allowed}.notice{margin:9px 0 0;color:#929991;text-align:center;font-size:9px}.toast{position:fixed;right:20px;bottom:20px;z-index:3;max-width:calc(100vw - 40px);padding:12px 15px;border:1px solid #c9d8ca;border-radius:5px;background:#f5faf5;color:var(--green-dark);box-shadow:var(--shadow);font-size:12px}.toast[hidden]{display:none}
    @media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) 310px;gap:12px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.topbar{padding:11px 15px}.brand-subtitle,.user-name{display:none}main{padding:20px 14px 28px}.page-heading{align-items:flex-start;flex-direction:column;gap:6px}.layout{grid-template-columns:1fr}.cart-panel{position:static;min-height:0}.cart-list{max-height:260px}}
    @media(max-width:390px){.catalog-panel,.cart-panel{padding:13px}.product-grid{grid-template-columns:1fr 1fr;gap:8px}.product-image,.image-fallback{height:112px}.product-content{min-height:145px;padding:10px}.product-name{font-size:12px}.add-button{padding:0 7px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">Q</div><div><div class="brand-title">El Quincho · Tienda y caja</div><div class="brand-subtitle">Catálogo para venta presencial y pedidos</div></div></div><div class="header-right"><span class="user-name" id="user-name"></span><button type="button" class="logout" id="logout">Cerrar sesión</button></div></header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">Punto de venta</p><h1>Catálogo y galería online</h1><p class="page-note">Productos disponibles en minimarket, botillería, carnicería y pollos asados.</p></div><time class="date-label" id="current-date"></time></div>
    <div class="layout">
      <section class="catalog-panel" aria-labelledby="catalog-title"><div class="section-heading"><h2 id="catalog-title">Seleccionar productos</h2><span class="count" id="badge-contador"></span></div>
        <nav class="filters" aria-label="Filtrar productos por categoría"><button type="button" class="filter" data-filter="todos" aria-pressed="true">Todos</button><button type="button" class="filter" data-filter="minimarket" aria-pressed="false">Minimarket</button><button type="button" class="filter" data-filter="botilleria" aria-pressed="false">Botillería</button><button type="button" class="filter" data-filter="carniceria" aria-pressed="false">Carnicería</button><button type="button" class="filter" data-filter="pollos" aria-pressed="false">Pollos asados</button></nav>
        <div class="product-grid" id="catalogo-productos" aria-live="polite"></div>
      </section>
      <aside class="cart-panel" aria-labelledby="cart-title"><div class="section-heading"><h2 id="cart-title">Carrito de compra</h2></div><div class="cart-list" id="lista-carrito" aria-live="polite"></div>
        <div class="checkout"><label class="payment-label" for="medio-pago">Método de pago / despacho</label><select id="medio-pago"><option value="Retiro en local">Retiro en local</option><option value="Delivery">Despacho a domicilio</option><option value="Transferencia bancaria">Transferencia bancaria</option></select><div class="total-row"><span class="total-label">Total</span><strong class="total-value" id="total-pagar">$0</strong></div><button type="button" class="checkout-button" id="checkout-button" disabled>Confirmar pedido / venta</button><p class="notice">El stock se descuenta al confirmar la compra.</p></div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    const productStorageKey = "elquincho-products-v1";
    const salesStorageKey = "elquincho-sales-v1";
    const currency = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
    const categoryLabels = { minimarket: "Minimarket", botilleria: "Botillería", carniceria: "Carnicería", pollos: "Pollos asados" };
    const defaultProducts = [
      { id: "pan-marraqueta", nombre: "Pan Marraqueta (kg)", precio: 1800, categoria: "minimarket", stock: 25, imagen: "https://images.unsplash.com/photo-1586444248902-2f64eddc13df?w=600&q=80" },
      { id: "leche-entera", nombre: "Leche Entera 1L", precio: 1200, categoria: "minimarket", stock: 15, imagen: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=600&q=80" },
      { id: "cerveza-1l", nombre: "Cerveza 1L", precio: 2000, categoria: "botilleria", stock: 30, imagen: "https://images.unsplash.com/photo-1608270105740-27f14cb4e9c7?w=600&q=80" },
      { id: "vino-750cc", nombre: "Vino Reserva 750cc", precio: 4500, categoria: "botilleria", stock: 10, imagen: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=600&q=80" },
      { id: "lomo-vetado", nombre: "Lomo Vetado (kg)", precio: 9800, categoria: "carniceria", stock: 12, imagen: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=600&q=80" },
      { id: "longanizas", nombre: "Longanizas Artesanales (kg)", precio: 6500, categoria: "carniceria", stock: 20, imagen: "https://images.unsplash.com/photo-1544025162-d76694265947?w=600&q=80" },
      { id: "pollo-papas", nombre: "Pollo Asado Entero + Papas", precio: 9500, categoria: "pollos", stock: 8, imagen: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=600&q=80" },
      { id: "medio-pollo-asado", nombre: "Medio Pollo Asado", precio: 5000, categoria: "pollos", stock: 5, imagen: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=600&q=80" }
    ];
    let activeCategory = "todos";
    let cart = new Map();
    let toastTimer;

    function loadProducts() {
      let savedById = new Map();
      try {
        const saved = JSON.parse(localStorage.getItem(productStorageKey));
        if (Array.isArray(saved)) savedById = new Map(saved.filter((item) => item && typeof item.id === "string").map((item) => [item.id, item]));
      } catch (error) { console.warn("No se pudo leer el inventario guardado.", error); }
      return defaultProducts.map((product) => {
        const stored = savedById.get(product.id);
        return { ...product, stock: Number.isInteger(stored?.stock) && stored.stock >= 0 ? stored.stock : product.stock };
      });
    }

    const products = loadProducts();

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
    }

    function renderProducts() {
      const visible = products.filter((product) => activeCategory === "todos" || product.categoria === activeCategory);
      document.getElementById("badge-contador").textContent = `${visible.length} productos`;
      const grid = document.getElementById("catalogo-productos");
      if (visible.length === 0) {
        const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "No hay productos en esta categoría."; grid.replaceChildren(empty); return;
      }
      grid.replaceChildren(...visible.map((product) => {
        const card = document.createElement("article"); card.className = "product-card";
        const image = document.createElement("img"); image.className = "product-image"; image.src = product.imagen; image.alt = product.nombre; image.loading = "lazy";
        image.addEventListener("error", () => { const fallback = document.createElement("div"); fallback.className = "image-fallback"; fallback.setAttribute("aria-hidden", "true"); fallback.textContent = "Q"; image.replaceWith(fallback); }, { once: true });
        const content = document.createElement("div"); content.className = "product-content";
        const category = document.createElement("span"); category.className = "product-category"; category.textContent = categoryLabels[product.categoria];
        const name = document.createElement("h3"); name.className = "product-name"; name.textContent = product.nombre;
        const price = document.createElement("strong"); price.className = "product-price"; price.textContent = currency.format(product.precio);
        const actions = document.createElement("div"); actions.className = "product-actions";
        const stock = document.createElement("span"); stock.className = "product-stock";
        const available = product.stock - (cart.get(product.id) || 0); stock.textContent = available > 0 ? `Stock: ${available}` : "Agotado";
        const addButton = document.createElement("button"); addButton.type = "button"; addButton.className = "add-button"; addButton.textContent = "Agregar"; addButton.disabled = available <= 0; addButton.setAttribute("aria-label", `Agregar ${product.nombre} al carrito`); addButton.addEventListener("click", () => addToCart(product.id));
        actions.append(stock, addButton); content.append(category, name, price, actions); card.append(image, content); return card;
      }));
    }

    function renderCart() {
      const entries = [...cart.entries()]; const container = document.getElementById("lista-carrito");
      if (!entries.length) { const empty = document.createElement("p"); empty.className = "cart-empty"; empty.textContent = "Tu carrito está vacío"; container.replaceChildren(empty); }
      else container.replaceChildren(...entries.map(([id, quantity]) => {
        const product = products.find((item) => item.id === id); const row = document.createElement("div"); row.className = "cart-row"; const details = document.createElement("div");
        const name = document.createElement("div"); name.className = "cart-name"; name.textContent = product.nombre;
        const price = document.createElement("div"); price.className = "cart-price"; price.textContent = `${quantity} × ${currency.format(product.precio)}`;
        const controls = document.createElement("div"); controls.className = "quantity"; const decrease = makeQuantityButton("−", `Quitar una unidad de ${product.nombre}`, () => changeQuantity(id, -1)); const count = document.createElement("span"); count.textContent = String(quantity); const increase = makeQuantityButton("+", `Agregar una unidad de ${product.nombre}`, () => changeQuantity(id, 1)); increase.disabled = quantity >= product.stock; controls.append(decrease, count, increase); details.append(name, price, controls);
        const subtotal = document.createElement("strong"); subtotal.className = "cart-subtotal"; subtotal.textContent = currency.format(product.precio * quantity); row.append(details, subtotal); return row;
      }));
      const total = entries.reduce((sum, [id, quantity]) => sum + products.find((item) => item.id === id).precio * quantity, 0);
      document.getElementById("total-pagar").textContent = currency.format(total); document.getElementById("checkout-button").disabled = entries.length === 0; renderProducts();
    }

    function makeQuantityButton(label, accessibleName, onClick) { const button = document.createElement("button"); button.type = "button"; button.textContent = label; button.setAttribute("aria-label", accessibleName); button.addEventListener("click", onClick); return button; }
    function addToCart(id) { const product = products.find((item) => item.id === id); if (!product || (cart.get(id) || 0) >= product.stock) return; cart.set(id, (cart.get(id) || 0) + 1); renderCart(); }
    function changeQuantity(id, amount) { const next = (cart.get(id) || 0) + amount; const product = products.find((item) => item.id === id); if (next <= 0) cart.delete(id); else if (product && next <= product.stock) cart.set(id, next); renderCart(); }

    function getSales() { try { const sales = JSON.parse(localStorage.getItem(salesStorageKey)); return Array.isArray(sales) ? sales : []; } catch (error) { return []; } }

    function checkout() {
      const entries = [...cart.entries()]; if (!entries.length) return;
      if (entries.some(([id, quantity]) => quantity > products.find((item) => item.id === id).stock)) { showToast("El stock cambió. Revisa las cantidades del carrito."); cart.clear(); renderCart(); return; }
      const items = entries.map(([id, cantidad]) => { const product = products.find((item) => item.id === id); return { id, nombre: product.nombre, categoria: categoryLabels[product.categoria], precio: product.precio, cantidad }; });
      const sales = getSales(); const total = items.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
      sales.push({ folio: sales.length + 1, items, total, medioPago: document.getElementById("medio-pago").value, fecha: new Date().toISOString() });
      const oldSales = localStorage.getItem(salesStorageKey); const changes = entries.map(([id, quantity]) => [products.find((item) => item.id === id), quantity]);
      try { changes.forEach(([product, quantity]) => { product.stock -= quantity; }); localStorage.setItem(salesStorageKey, JSON.stringify(sales)); localStorage.setItem(productStorageKey, JSON.stringify(products)); }
      catch (error) { changes.forEach(([product, quantity]) => { product.stock += quantity; }); try { if (oldSales === null) localStorage.removeItem(salesStorageKey); else localStorage.setItem(salesStorageKey, oldSales); } catch (rollbackError) { console.error("No se pudo revertir la venta.", rollbackError); } showToast("No se pudo guardar la venta. Inténtalo nuevamente."); return; }
      cart.clear(); renderCart(); showToast(`Pedido registrado · ${currency.format(total)}`);
    }

    document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => { activeCategory = button.dataset.filter; document.querySelectorAll("[data-filter]").forEach((filter) => filter.setAttribute("aria-pressed", String(filter === button))); renderProducts(); }));
    document.getElementById("checkout-button").addEventListener("click", checkout);
    document.getElementById("logout").addEventListener("click", () => { localStorage.removeItem("usuarioRol"); localStorage.removeItem("usuarioEmail"); window.location.href = "../index.html"; });
    document.getElementById("user-name").textContent = localStorage.getItem("usuarioEmail") || "Vendedor";
    document.getElementById("current-date").textContent = new Date().toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long" });
    if (localStorage.getItem("usuarioRol") !== "seller") window.location.replace("../index.html");
    renderCart();
  </script>
</body>
</html>
