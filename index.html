<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3ed">
  <title>El Quincho | Punto de venta</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --ink: #202b25;
      --muted: #788078;
      --line: #e6e5dc;
      --green: #245c43;
      --green-dark: #194733;
      --green-pale: #e8f0e9;
      --red: #a64b37;
      --red-pale: #f7eae5;
      --gold: #d3a344;
      --shadow: 0 2px 10px rgb(34 45 37 / 5%);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .topbar { height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--green); color: white; font-family: Georgia, serif; font-size: 19px; font-weight: 700; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 22px; }
    .clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .connection { display: flex; align-items: center; gap: 7px; color: #53675a; font-size: 12px; }
    .connection::before { width: 7px; height: 7px; border-radius: 50%; background: #4b9462; content: ""; }
    main { width: min(1320px, 100%); margin: 0 auto; padding: 28px 32px 40px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 6px; color: var(--red); font-size: 11px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 600; letter-spacing: 0; }
    .date-label { color: var(--muted); font-size: 13px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; gap: 20px; }
    .catalog, .checkout { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }
    .catalog { min-height: 590px; padding: 22px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 19px; font-weight: 600; letter-spacing: 0; }
    .stock-summary { color: var(--muted); font-size: 12px; }
    .catalog-controls { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-wrap { position: relative; flex: 1; }
    .search-icon { position: absolute; top: 50%; left: 12px; color: #879087; transform: translateY(-50%); pointer-events: none; }
    .search { width: 100%; height: 40px; padding: 0 12px 0 36px; border: 1px solid var(--line); border-radius: 5px; outline: none; background: #fff; color: var(--ink); font-size: 13px; }
    .search:focus, select:focus { border-color: #7b9b84; box-shadow: 0 0 0 3px rgb(36 92 67 / 9%); }
    .categories { display: flex; gap: 7px; overflow-x: auto; margin: 0 0 18px; padding: 0 0 2px; scrollbar-width: thin; }
    .category-button { min-height: 32px; flex: 0 0 auto; padding: 0 11px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: #646d65; cursor: pointer; font-size: 12px; transition: background 140ms, color 140ms, border-color 140ms; }
    .category-button:hover { border-color: #aeb9af; }
    .category-button[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: white; }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .product { position: relative; min-height: 132px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; text-align: left; cursor: pointer; transition: border-color 150ms, transform 150ms, box-shadow 150ms; }
    .product:hover:not(:disabled) { transform: translateY(-2px); border-color: #a6b8a8; box-shadow: 0 4px 12px rgb(34 45 37 / 7%); }
    .product:disabled { cursor: not-allowed; opacity: .48; }
    .product-category { color: var(--muted); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
    .product-name { display: block; margin: 9px 0 12px; font-size: 14px; font-weight: 650; line-height: 1.35; }
    .product-bottom { width: 100%; display: flex; align-items: end; justify-content: space-between; gap: 8px; }
    .product-price { color: var(--green); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .product-stock { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .empty-products { grid-column: 1 / -1; padding: 42px 12px; color: var(--muted); text-align: center; font-size: 13px; }
    .checkout { position: sticky; top: 18px; display: flex; min-height: 590px; flex-direction: column; padding: 20px; }
    .ticket-heading { display: flex; align-items: start; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .ticket-number { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .clear-button { padding: 5px 0 5px 8px; border: 0; background: transparent; color: var(--red); cursor: pointer; font-size: 12px; }
    .cart-list { flex: 1; min-height: 180px; max-height: 300px; overflow: auto; padding: 4px 0; }
    .cart-empty { display: grid; min-height: 180px; place-content: center; color: #989e97; text-align: center; }
    .cart-empty-mark { margin-bottom: 8px; color: #aeb7ad; font-family: Georgia, serif; font-size: 28px; }
    .cart-empty p { margin: 0; font-size: 12px; }
    .cart-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; padding: 12px 0; border-bottom: 1px solid #efeee8; }
    .cart-item-name { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; line-height: 1.3; }
    .cart-item-price { color: var(--muted); font-size: 11px; }
    .cart-item-total { padding-top: 1px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .quantity { display: inline-flex; align-items: center; gap: 9px; margin-top: 8px; }
    .quantity button { width: 23px; height: 23px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: white; cursor: pointer; }
    .quantity button:hover { border-color: #9eac9f; background: var(--green-pale); }
    .quantity span { min-width: 12px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
    .ticket-footer { padding-top: 15px; border-top: 1px solid var(--line); }
    .payment-label { display: block; margin-bottom: 6px; color: #687269; font-size: 11px; font-weight: 600; }
    select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; outline: none; background: white; color: var(--ink); font-size: 12px; }
    .total-row { display: flex; align-items: baseline; justify-content: space-between; margin: 17px 0; }
    .total-label { color: #5f685f; font-size: 13px; }
    .total-value { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .checkout-button { width: 100%; height: 46px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 5px; background: var(--green); color: #fff; cursor: pointer; font-size: 13px; font-weight: 700; transition: background 140ms; }
    .checkout-button:hover:not(:disabled) { background: var(--green-dark); }
    .checkout-button:disabled { background: #c4ccc4; cursor: not-allowed; }
    .footnote { margin: 10px 0 0; color: #929991; text-align: center; font-size: 10px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 3; max-width: min(380px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid #c9d8ca; border-radius: 5px; background: #f5faf5; color: var(--green-dark); box-shadow: var(--shadow); font-size: 13px; animation: appear 180ms ease-out; }
    .toast[hidden] { display: none; }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
      main { padding-right: 20px; padding-left: 20px; }
      .topbar { padding-right: 20px; padding-left: 20px; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px) {
      .topbar { height: 60px; padding: 0 16px; }
      .brand-mark { width: 32px; height: 32px; }
      .brand-name { font-size: 17px; }
      .brand-subtitle, .clock { display: none; }
      main { padding: 22px 14px 28px; }
      .page-heading { align-items: start; flex-direction: column; gap: 7px; margin-bottom: 16px; }
      h1 { font-size: 27px; }
      .workspace { grid-template-columns: 1fr; }
      .catalog { min-height: 0; padding: 16px; }
      .checkout { position: static; min-height: 0; padding: 16px; }
      .cart-list { max-height: 250px; }
    }
    @media (max-width: 390px) {
      .product-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
      .product { min-height: 124px; padding: 11px; }
      .product-name { font-size: 13px; }
      .catalog-controls { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="El Quincho, punto de venta">
      <div class="brand-mark" aria-hidden="true">Q</div>
      <div>
        <div class="brand-name">El Quincho</div>
        <div class="brand-subtitle">Minimarket · Botillería · Pollos</div>
      </div>
    </div>
    <div class="topbar-right">
      <time class="clock" id="clock"></time>
      <span class="connection">Guardado en este dispositivo</span>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">Punto de venta</p>
        <h1>Venta del día</h1>
      </div>
      <div class="date-label" id="date-label"></div>
    </div>

    <div class="workspace">
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="section-heading">
          <h2 id="catalog-title">Catálogo</h2>
          <span class="stock-summary" id="stock-summary"></span>
        </div>
        <div class="catalog-controls">
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" class="search" type="search" placeholder="Buscar producto..." aria-label="Buscar producto">
          </label>
        </div>
        <nav class="categories" id="categories" aria-label="Filtrar por categoría"></nav>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
      </section>

      <aside class="checkout" aria-labelledby="ticket-title">
        <div class="ticket-heading">
          <div>
            <h2 id="ticket-title">Venta actual</h2>
            <div class="ticket-number" id="ticket-number"></div>
          </div>
          <button type="button" class="clear-button" id="clear-cart">Vaciar</button>
        </div>
        <div class="cart-list" id="cart-list" aria-live="polite"></div>
        <div class="ticket-footer">
          <label class="payment-label" for="payment-method">Medio de pago</label>
          <select id="payment-method">
            <option value="Efectivo">Efectivo</option>
            <option value="Débito">Tarjeta de débito</option>
            <option value="Crédito">Tarjeta de crédito</option>
            <option value="Transferencia">Transferencia</option>
          </select>
          <div class="total-row">
            <span class="total-label">Total</span>
            <strong class="total-value" id="total-value">$0</strong>
          </div>
          <button type="button" class="checkout-button" id="checkout-button" disabled>
            <span aria-hidden="true">✓</span> Registrar venta
          </button>
          <p class="footnote">El stock se descuenta al confirmar la venta.</p>
        </div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    const defaultProducts = [
      { id: "pan-marraqueta", name: "Pan marraqueta", category: "Minimarket", price: 1800, unit: "kg", stock: 20 },
      { id: "pan-hallulla", name: "Pan hallulla", category: "Minimarket", price: 1700, unit: "kg", stock: 18 },
      { id: "leche-entera", name: "Leche entera", category: "Minimarket", price: 1100, unit: "un.", stock: 24 },
      { id: "bebida-1l", name: "Bebida 1.5 L", category: "Minimarket", price: 1900, unit: "un.", stock: 12 },
      { id: "huevos-docena", name: "Huevos (docena)", category: "Minimarket", price: 3200, unit: "un.", stock: 10 },
      { id: "cerveza-1l", name: "Cerveza 1 L", category: "Botillería", price: 2000, unit: "un.", stock: 24 },
      { id: "cerveza-pack", name: "Cerveza (pack 6)", category: "Botillería", price: 8500, unit: "pack", stock: 8 },
      { id: "vino-tinto", name: "Vino tinto", category: "Botillería", price: 4500, unit: "bot.", stock: 12 },
      { id: "bebida-energetica", name: "Bebida energética", category: "Botillería", price: 1600, unit: "un.", stock: 15 },
      { id: "pollo-papas", name: "Pollo asado + papas", category: "Pollos", price: 9500, unit: "un.", stock: 12 },
      { id: "pollo-entero", name: "Pollo asado entero", category: "Pollos", price: 8000, unit: "un.", stock: 10 },
      { id: "papas-fritas", name: "Papas fritas", category: "Pollos", price: 1800, unit: "porción", stock: 20 }
    ];
    const storageKeys = { products: "elquincho-products-v1", sales: "elquincho-sales-v1" };
    const money = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
    let products = loadProducts();
    let cart = new Map();
    let activeCategory = "Todos";
    let toastTimer;

    function loadProducts() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKeys.products));
        if (Array.isArray(saved) && saved.every((item) => item && typeof item.id === "string" && Number.isFinite(item.stock))) return saved;
      } catch (error) {
        console.warn("No se pudo leer el inventario guardado.", error);
      }
      return defaultProducts.map((product) => ({ ...product }));
    }

    function saveProducts() {
      localStorage.setItem(storageKeys.products, JSON.stringify(products));
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date-label").textContent = now.toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    function renderCategories() {
      const categories = ["Todos", ...new Set(products.map((product) => product.category))];
      const container = document.getElementById("categories");
      container.replaceChildren(...categories.map((category) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-button";
        button.textContent = category;
        button.setAttribute("aria-pressed", String(activeCategory === category));
        button.addEventListener("click", () => {
          activeCategory = category;
          renderCategories();
          renderProducts();
        });
        return button;
      }));
    }

    function renderProducts() {
      const query = document.getElementById("search").value.trim().toLocaleLowerCase("es-CL");
      const visible = products.filter((product) => {
        const matchesCategory = activeCategory === "Todos" || product.category === activeCategory;
        return matchesCategory && product.name.toLocaleLowerCase("es-CL").includes(query);
      });
      const grid = document.getElementById("product-grid");
      if (visible.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-products";
        empty.textContent = "No hay productos que coincidan con la búsqueda.";
        grid.replaceChildren(empty);
      } else {
        grid.replaceChildren(...visible.map((product) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "product";
          button.disabled = product.stock <= 0;
          button.setAttribute("aria-label", `${product.name}, ${money.format(product.price)} por ${product.unit}, stock ${product.stock}`);
          const category = document.createElement("span");
          category.className = "product-category";
          category.textContent = product.category;
          const name = document.createElement("span");
          name.className = "product-name";
          name.textContent = product.name;
          const bottom = document.createElement("span");
          bottom.className = "product-bottom";
          const price = document.createElement("span");
          price.className = "product-price";
          price.textContent = money.format(product.price);
          const stock = document.createElement("span");
          stock.className = "product-stock";
          stock.textContent = product.stock > 0 ? `Stock ${product.stock}` : "Agotado";
          bottom.append(price, stock);
          button.append(category, name, bottom);
          button.addEventListener("click", () => addToCart(product.id));
          return button;
        }));
      }
      document.getElementById("stock-summary").textContent = `${products.length} productos · ${products.reduce((sum, product) => sum + product.stock, 0)} unidades`;
    }

    function addToCart(productId) {
      const product = products.find((item) => item.id === productId);
      if (!product || (cart.get(productId) || 0) >= product.stock) return;
      cart.set(productId, (cart.get(productId) || 0) + 1);
      renderCart();
    }

    function changeQuantity(productId, amount) {
      const next = (cart.get(productId) || 0) + amount;
      const product = products.find((item) => item.id === productId);
      if (next <= 0) cart.delete(productId);
      else if (product && next <= product.stock) cart.set(productId, next);
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cart-list");
      const entries = [...cart.entries()];
      if (entries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "cart-empty";
        const mark = document.createElement("span");
        mark.className = "cart-empty-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = "Q";
        const message = document.createElement("p");
        message.textContent = "Agrega productos para comenzar";
        empty.append(mark, message);
        container.replaceChildren(empty);
      } else {
        container.replaceChildren(...entries.map(([productId, quantity]) => {
          const product = products.find((item) => item.id === productId);
          const row = document.createElement("div");
          row.className = "cart-row";
          const details = document.createElement("div");
          const name = document.createElement("span");
          name.className = "cart-item-name";
          name.textContent = product.name;
          const price = document.createElement("span");
          price.className = "cart-item-price";
          price.textContent = `${money.format(product.price)} / ${product.unit}`;
          const quantityControls = document.createElement("div");
          quantityControls.className = "quantity";
          const decrease = makeQuantityButton("−", `Quitar una unidad de ${product.name}`, () => changeQuantity(productId, -1));
          const quantityLabel = document.createElement("span");
          quantityLabel.textContent = String(quantity);
          const increase = makeQuantityButton("+", `Agregar una unidad de ${product.name}`, () => changeQuantity(productId, 1));
          increase.disabled = quantity >= product.stock;
          quantityControls.append(decrease, quantityLabel, increase);
          details.append(name, price, quantityControls);
          const total = document.createElement("span");
          total.className = "cart-item-total";
          total.textContent = money.format(product.price * quantity);
          row.append(details, total);
          return row;
        }));
      }
      const total = entries.reduce((sum, [productId, quantity]) => {
        const product = products.find((item) => item.id === productId);
        return sum + product.price * quantity;
      }, 0);
      document.getElementById("total-value").textContent = money.format(total);
      document.getElementById("checkout-button").disabled = entries.length === 0;
      document.getElementById("ticket-number").textContent = `Folio ${String(getSales().length + 1).padStart(4, "0")}`;
      renderProducts();
    }

    function makeQuantityButton(label, accessibleName, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("aria-label", accessibleName);
      button.addEventListener("click", onClick);
      return button;
    }

    function getSales() {
      try {
        const sales = JSON.parse(localStorage.getItem(storageKeys.sales));
        return Array.isArray(sales) ? sales : [];
      } catch (error) {
        return [];
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
    }

    function registerSale() {
      if (cart.size === 0) return;
      const items = [...cart.entries()].map(([productId, quantity]) => {
        const product = products.find((item) => item.id === productId);
        return { id: product.id, nombre: product.name, categoria: product.category, precio: product.price, cantidad: quantity };
      });
      for (const [productId, quantity] of cart) {
        const product = products.find((item) => item.id === productId);
        if (!product || quantity > product.stock) {
          showToast("El stock cambió. Revisa las cantidades antes de cobrar.");
          cart.clear();
          renderCart();
          return;
        }
      }
      const sale = {
        folio: getSales().length + 1,
        items,
        total: items.reduce((sum, item) => sum + item.precio * item.cantidad, 0),
        medioPago: document.getElementById("payment-method").value,
        fecha: new Date().toISOString()
      };
      const sales = getSales();
      sales.push(sale);
      try {
        localStorage.setItem(storageKeys.sales, JSON.stringify(sales));
        for (const [productId, quantity] of cart) {
          products.find((item) => item.id === productId).stock -= quantity;
        }
        saveProducts();
      } catch (error) {
        showToast("No se pudo guardar la venta. Revisa el almacenamiento del navegador.");
        return;
      }
      cart.clear();
      renderCart();
      showToast(`Venta ${String(sale.folio).padStart(4, "0")} registrada · ${money.format(sale.total)}`);
    }

    document.getElementById("search").addEventListener("input", renderProducts);
    document.getElementById("clear-cart").addEventListener("click", () => {
      cart.clear();
      renderCart();
    });
    document.getElementById("checkout-button").addEventListener("click", registerSale);
    updateClock();
    setInterval(updateClock, 30000);
    renderCategories();
    renderCart();
  </script>
</body>
</html>
