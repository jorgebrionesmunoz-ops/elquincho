<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24372d">
  <title>Acceso | El Quincho</title>
  <style>
    :root {
      color-scheme: light;
      --forest: #24372d;
      --forest-dark: #19271f;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --ink: #202b25;
      --muted: #788078;
      --line: #e6e5dc;
      --green: #245c43;
      --gold: #d3a344;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 22px; background-color: var(--forest); background-image: linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px), linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px); background-size: 34px 34px; color: var(--ink); }
    .login-card { width: min(440px, 100%); padding: 32px; border: 1px solid rgb(255 255 255 / 40%); border-radius: 8px; background: var(--surface); box-shadow: 0 24px 70px rgb(0 0 0 / 22%); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 25px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 9px; background: var(--green); color: white; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 600; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .eyebrow { margin: 0 0 6px; color: #966a22; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-align: center; text-transform: uppercase; }
    .intro { margin: 0 0 22px; color: #59635b; text-align: center; font-size: 13px; }
    form { display: grid; gap: 15px; }
    label { display: grid; gap: 6px; color: #626b63; font-size: 11px; font-weight: 650; }
    input, select { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; outline: none; background: white; color: var(--ink); font: inherit; font-size: 13px; }
    input:focus, select:focus { border-color: #7b9b84; box-shadow: 0 0 0 3px rgb(36 92 67 / 10%); }
    button { min-height: 46px; margin-top: 3px; border: 0; border-radius: 4px; background: var(--forest-dark); color: white; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; transition: background 140ms; }
    button:hover { background: var(--green); }
    .notice { margin: 0; padding: 10px 11px; border-left: 3px solid var(--gold); background: #f7f3e8; color: #6d6249; font-size: 11px; line-height: 1.5; }
    @media (max-width: 440px) { .login-card { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Q</div>
      <div>
        <h1>El Quincho</h1>
        <p class="subtitle">Sistema de inventario y ventas</p>
      </div>
    </div>
    <p class="eyebrow">Acceso al sistema</p>
    <p class="intro">Ingresa tus datos de prueba y selecciona un perfil.</p>
    <form id="login-form">
      <label for="email">Correo electrónico
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="tu.correo@elquincho.cl">
      </label>
      <label for="password">Contraseña
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña">
      </label>
      <label for="rol">Perfil de usuario
        <select id="rol" name="rol">
          <option value="seller">Vendedor · Caja y ventas</option>
          <option value="warehouse">Bodeguero · Inventario y producción</option>
          <option value="admin">Administrador · Acceso total</option>
        </select>
      </label>
      <button type="submit">Ingresar al dashboard</button>
      <p class="notice">Modo de demostración: el correo y la contraseña son obligatorios, pero no se verifican ni se guardan. El rol seleccionado solo simula permisos.</p>
    </form>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!event.currentTarget.reportValidity()) return;
      const rolSeleccionado = document.getElementById("rol").value;
      localStorage.setItem("usuarioRol", rolSeleccionado);
      localStorage.setItem("usuarioEmail", document.getElementById("email").value.trim());
      if (rolSeleccionado === "admin") {
        window.location.href = "dashboard/admin.html";
      } else if (rolSeleccionado === "warehouse") {
        window.location.href = "dashboard/warehouse.html";
      } else {
        window.location.href = "dashboard/seller.html";
      }
    });
  </script>
</body>
</html>
